<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dizzy Android</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}#nes{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}#nes canvas{height:100%!important;width:auto!important;image-rendering:pixelated}.ctrl{position:fixed;z-index:4;bottom:6vh;opacity:.7;user-select:none}.left{left:3vw}.right{right:3vw}.btn{display:inline-flex;align-items:center;justify-content:center;margin:5px;width:64px;height:64px;border:1px solid #fff8;border-radius:50%;background:#0008;color:#fff;font-size:22px;font-weight:700}.menu{position:fixed;z-index:8;top:10px;right:10px;background:#000a;color:#fff;border:1px solid #fff6;border-radius:10px;padding:8px 12px}#panel{display:none;position:fixed;z-index:9;inset:0;background:#000d;align-items:center;justify-content:center}.card{background:#17202b;padding:24px;border-radius:18px;text-align:center;min-width:270px}.life{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px}.life button{font-size:30px;width:54px;height:54px}.life span{font-size:28px;min-width:70px}</style></head><body><div id="nes"></div><button class="menu" onclick="panel.style.display='flex'">☰</button><div class="ctrl left"><div><span class="btn" data-btn="UP">▲</span></div><div><span class="btn" data-btn="LEFT">◀</span><span class="btn" data-btn="DOWN">▼</span><span class="btn" data-btn="RIGHT">▶</span></div></div><div class="ctrl right"><span class="btn" data-btn="B">B</span><span class="btn" data-btn="A">A</span></div><div id="panel"><div class="card"><h2>Fantastic Adventures of Dizzy</h2><div>Język: <b>polski</b> — ą ć ę ł ń ó ś ź ż</div><p>Liczba żyć</p><div class="life"><button onclick="life(-1)">−</button><span id="lives">3</span><button onclick="life(1)">+</button></div><label><input id="inf" type="checkbox" onchange="life(0)"> Nieskończone życia ∞</label><p><button onclick="panel.style.display='none'">Wróć do gry</button></p></div></div><script src="jsnes.min.js"></script><script>let browser=null,lifeCount=+(localStorage.dizzyLives||3);const panel=document.getElementById('panel'),out=document.getElementById('lives'),inf=document.getElementById('inf');inf.checked=localStorage.dizzyInfinite==='1';function life(d){lifeCount=Math.max(1,Math.min(99,lifeCount+d));localStorage.dizzyLives=lifeCount;localStorage.dizzyInfinite=inf.checked?'1':'0';out.textContent=inf.checked?'∞':lifeCount}life(0);const map={UP:()=>jsnes.Controller.BUTTON_UP,DOWN:()=>jsnes.Controller.BUTTON_DOWN,LEFT:()=>jsnes.Controller.BUTTON_LEFT,RIGHT:()=>jsnes.Controller.BUTTON_RIGHT,A:()=>jsnes.Controller.BUTTON_A,B:()=>jsnes.Controller.BUTTON_B};function press(el,on){if(!browser)return;const b=map[el.dataset.btn]();on?browser.nes.buttonDown(1,b):browser.nes.buttonUp(1,b)}document.querySelectorAll('[data-btn]').forEach(el=>{el.onpointerdown=e=>{e.preventDefault();press(el,true)};el.onpointerup=el.onpointercancel=e=>{e.preventDefault();press(el,false)}});window.addEventListener('load',()=>{browser=new jsnes.Browser({container:document.getElementById('nes')});jsnes.Browser.loadROMFromURL('game.nes',(err,data)=>{if(err)return;browser.loadROM(data);setTimeout(()=>browser.fitInParent(),100)});window.onresize=()=>browser&&browser.fitInParent()});</script></body></html>
