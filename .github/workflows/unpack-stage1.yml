name: Restore Android Project
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore project files
        run: |
          mkdir restored
          unzip -q Dizzy-Android-Project.zip -d restored
          cp -a restored/Dizzy-Android-Project/. .
          rm -rf restored
          rm -f Dizzy-Android-Project.zip
          rm -f .github/workflows/build-apk.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Restore complete Android project"
          git push
