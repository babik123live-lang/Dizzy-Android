name: Unpack Fullscreen Stage1
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/dizzy
          unzip -q Dizzy-Android-Project.zip -d /tmp/dizzy
          shopt -s dotglob
          cp -a /tmp/dizzy/Dizzy-Android-Project/* .
          echo '' | base64 -d > app/src/main/assets/index.html
          rm -f Dizzy-Android-Project.zip
          rm -f .github/workflows/unpack-stage1.yml
      - name: Commit unpacked project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack fullscreen Android project" || exit 0
          git push
