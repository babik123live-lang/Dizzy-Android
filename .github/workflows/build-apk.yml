name: Build Dizzy APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete project
        run: |
          cp app/src/main/assets/index.html /tmp/index.html
          rm -rf /tmp/fullproject
          mkdir -p /tmp/fullproject
          unzip -q Dizzy-Android-Project.zip -d /tmp/fullproject
          cp -a /tmp/fullproject/Dizzy-Android-Project/. .
          cp /tmp/index.html app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle JSNES
        run: |
          mkdir -p .ci
          npm install --prefix .ci --no-save jsnes@2.0.0
          cp .ci/node_modules/jsnes/dist/jsnes.min.js app/src/main/assets/jsnes.min.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace
          echo "=== APK INFO ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: Dizzy-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
