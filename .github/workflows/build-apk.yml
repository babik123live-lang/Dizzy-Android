name: Build Dizzy APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -o Dizzy-Android-Project.zip -d project
          ls -la project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle JSNES 2.0.0
        working-directory: project/Dizzy-Android-Project
        run: |
          mkdir -p .ci
          npm install --prefix .ci --no-save jsnes@2.0.0
          cp .ci/node_modules/jsnes/dist/jsnes.min.js app/src/main/assets/jsnes.min.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/Dizzy-Android-Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dizzy-Android-APK
          path: project/Dizzy-Android-Project/app/build/outputs/apk/debug/app-debug.apk
