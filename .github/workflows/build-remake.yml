name: Build native Dizzy remake

on:
  push:
    paths: ["remake/**", "remake-app/**", ".github/workflows/build-remake.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native APK
        working-directory: remake-app
        run: gradle :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r remake-app/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.dizzy.remake
            adb shell am start -W -n com.dizzy.remake/.MainActivity
            sleep 5
            if [ -z "$(adb shell pidof com.dizzy.remake | tr -d '\r')" ]; then echo "APP_EXITED"; adb logcat -d | grep -Ei "dizzy|AndroidRuntime|ActivityManager|ActivityTaskManager|am_crash|FATAL EXCEPTION" | tail -n 600; exit 1; fi
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep "com.dizzy.remake" >/dev/null
            adb shell pidof com.dizzy.remake

      - uses: actions/upload-artifact@v4
        with:
          name: Dizzy-Remake-native
          path: remake-app/app/build/outputs/apk/debug/app-debug.apk
